services:
  # ── API Server (Web Service) ────────────────────────────────────────────────
  - type: web
    name: fileorbit-api
    runtime: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm run build:api
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard — never commit secret values here
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      # Comma-separated list of allowed frontend origins
      # e.g. https://fileorbit-frontend.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false
      # Public URL of this API service — used to build OAuth redirect URIs
      # e.g. https://fileorbit-api.onrender.com
      - key: API_BASE_URL
        sync: false
      # Public URL of the frontend — used to redirect users back after OAuth
      # e.g. https://fileorbit-frontend.onrender.com
      - key: FRONTEND_URL
        sync: false
      # Google Drive OAuth 2.0 credentials (from Google Cloud Console)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Future providers — uncomment and add credentials when ready
      # - key: DROPBOX_CLIENT_ID
      # - key: DROPBOX_CLIENT_SECRET
      # - key: ONEDRIVE_CLIENT_ID
      # - key: ONEDRIVE_CLIENT_SECRET
      # - key: BOX_CLIENT_ID
      # - key: BOX_CLIENT_SECRET
      # Amazon Photos (Login with Amazon — identity only, Drive API is closed)
      # - key: AMAZON_CLIENT_ID
      # - key: AMAZON_CLIENT_SECRET

  # ── Frontend (Static Site) ──────────────────────────────────────────────────
  - type: static
    name: fileorbit-frontend
    buildCommand: pnpm install --no-frozen-lockfile && pnpm run build:frontend
    staticPublishPath: artifacts/file-manager/dist/public
    # Rewrite all paths to index.html so client-side routing (wouter) works
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Required by vite.config.ts at build time (not used at runtime)
      - key: PORT
        value: 3000
      - key: BASE_PATH
        value: /
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      # Point to your API service: https://fileorbit-api.onrender.com/api/__clerk
      - key: VITE_CLERK_PROXY_URL
        sync: false
      # Point to your API service: https://fileorbit-api.onrender.com
      - key: VITE_API_BASE_URL
        sync: false
